name: Godot checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Import and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Godot, import project, and run tests
        run: make install
